{% extends "base.html" %}
{% block title %}Crop Recommendation - ArogyaKrishi{% endblock %}
{% block content %}
<div class="container section">
  <div class="card form-wide">
    <h2 class="form-title">Crop recommendation</h2>
    <p class="form-sub">Enter your soil test / sensor readings to get the best-fit crop.</p>
    <form method="POST">
      <div class="grid grid-2">
        <div class="field">
          <label for="nitrogen">Nitrogen - N (kg/ha)</label>
          <input type="number" step="0.1" id="nitrogen" name="nitrogen" required placeholder="e.g. 90">
        </div>
        <div class="field">
          <label for="phosphorus">Phosphorus - P (kg/ha)</label>
          <input type="number" step="0.1" id="phosphorus" name="phosphorus" required placeholder="e.g. 42">
        </div>
        <div class="field">
          <label for="potassium">Potassium - K (kg/ha)</label>
          <input type="number" step="0.1" id="potassium" name="potassium" required placeholder="e.g. 43">
        </div>
        <div class="field">
          <label for="temperature">Temperature (°C)</label>
          <input type="number" step="0.1" id="temperature" name="temperature" required placeholder="e.g. 26.5">
        </div>
        <div class="field">
          <label for="humidity">Humidity (%)</label>
          <input type="number" step="0.1" id="humidity" name="humidity" required placeholder="e.g. 80">
        </div>
        <div class="field">
          <label for="ph">Soil pH</label>
          <input type="number" step="0.01" id="ph" name="ph" required placeholder="e.g. 6.5">
        </div>
        <div class="field" style="grid-column:1/-1;">
          <label for="rainfall">Rainfall (mm)</label>
          <input type="number" step="0.1" id="rainfall" name="rainfall" required placeholder="e.g. 200">
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Recommend a crop</button>
    </form>
  </div>
</div>
{% endblock %}
